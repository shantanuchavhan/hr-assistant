<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage HR Documents</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Quicksand:500,700&display=swap">
    <style>
        body { background: radial-gradient(ellipse at 50% 20%, #f5faef 50%, #e1ffea 100%); font-family: 'Quicksand', Arial, sans-serif; }
        .manage-container { max-width: 600px; margin: 38px auto 28px auto; background: #fafdff; border-radius: 18px; box-shadow: 0 8px 36px 0 #b0ebbe9e; padding: 30px 32px 20px 32px; border: 2px solid #b7eecf; }
        .header-flex { display: flex; align-items: center; justify-content: space-between; }
        .file-list { margin-top: 20px; }
        .file-list ul { padding-left: 22px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand navbar-light bg-light mb-2">
        <a class="navbar-brand font-weight-bold" href="/">HR Assistant</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/manage">Upload/Delete Documents</a>
            <a class="nav-link" href="/">Back to Chatbot</a>
        </div>
    </nav>
    <div class="manage-container">
        <div class="header-flex">
            <h3 class="mb-0" style="font-weight:700;">Upload / Delete HR Documents</h3>
            <img src="https://cdn-icons-png.flaticon.com/512/584/584812.png" alt="Files" width="38" height="38">
        </div>
        <form id="uploadForm" enctype="multipart/form-data" class="mt-3 mb-2">
            <input type="file" id="fileInput" name="files[]" multiple accept=".txt" required>
            <button class="btn btn-success btn-sm" type="submit">Upload</button>
            <span id="uploadStatus" style="margin-left:10px;font-weight:600;"></span>
        </form>
        <div class="file-list" id="fileListArea"></div>
    </div>
    <script>
        // --- Upload logic ---
        const uploadForm = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');
        const fileListArea = document.getElementById('fileListArea');

        async function refreshFileList() {
            const res = await fetch("/list_files");
            const data = await res.json();
            if (!data.files.length) {
                fileListArea.innerHTML = "<b>No files uploaded yet.</b>";
                return;
            }
            let html = "<b>Current files:</b><ul>";
            for (let filename of data.files) {
                html += `<li>${filename} <button class="btn btn-danger btn-sm" onclick="deleteFile('${filename}')">Delete</button></li>`;
            }
            html += "</ul>";
            fileListArea.innerHTML = html;
        }
        window.deleteFile = async function(filename) {
            if (!confirm("Delete file " + filename + "?")) return;
            const res = await fetch("/delete_file", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({filename})
            });
            const data = await res.json();
            alert(data.message || data.error);
            refreshFileList();
        };

        uploadForm.onsubmit = async function(e) {
            e.preventDefault();
            const files = fileInput.files;
            if (!files.length) {
                uploadStatus.innerText = "No files selected.";
                return;
            }
            uploadStatus.innerText = "Uploading...";
            let formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                formData.append('files[]', files[i]);
            }
            try {
                const resp = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await resp.json();
                if (data.uploaded && data.uploaded.length > 0) {
                    uploadStatus.innerText = `Uploaded: ${data.uploaded.join(", ")}. Index rebuilt.`;
                } else {
                    uploadStatus.innerText = data.error || "Upload failed.";
                }
            } catch (err) {
                uploadStatus.innerText = "Error: " + err.message;
            }
            uploadForm.reset();
            refreshFileList();
        };

        // Initial load
        refreshFileList();
    </script>
</body>
</html>
